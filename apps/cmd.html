<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMD</title>
    <style>
        /* Finnialy learned how to use css varibles */
        :root{
            --bg-color: #000000;
            --text-color: #06f56a;
            --prompt-color: #00e1fe;
            --dim-color: #2fa23c;
            --error-color: #ff1100;
            --accent-color: #ffc800;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body  {
            /* hide the scroll bar because it looks ugly */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        /* some code ai gave just incase scroll bar dosent hide */
        ::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        body {
            /* use the css variables that i made eariler */
            background-color: var(--bg-color);
            color: var(--text-color);
            font: 15px/1.4 'comic sans ms', 'Courier New', Courier, monospace;
            height: 100vh;
            padding: 16px;
            overflow-y: auto;
        }
        .line {
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .line-prompt, .prompt-label { 
            color: var(--prompt-color); 
            font-weight: bold; 
        }
        .line-error { 
            color: var(--error-color); 
        }
        .line-accent { 
            color: var(--accent-color); 
        }
        .line-dim { 
            color: var(--dim-color); 
        }
        .line-rainbow,
        .line-gradient {
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            background-repeat: repeat-x;
            background-size: 400px 100%;
            animation: terminal-gradient 5s linear infinite;
        }
        .line-rainbow {
            background-image: linear-gradient(
                105deg,
                #ff1744,
                #ff9100,
                #ffe600,
                #00e676,
                #00b0ff,
                #7c4dff,
                #ff1744,
                #ff1744
            );
        }
        .line-gradient {
            background-image: linear-gradient(105deg, var(--line-gradient));
        }
        @keyframes terminal-gradient {
            from { background-position: 0 0; }
            to { background-position: -400px 0; }
        }
        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .input-wrap {
            position: relative;
            flex: 1;
        }
        .cmd-ghost,
        .cmd-input {
            background: transparent;
            border: none;
            outline: none;
            color: inherit;
            font: inherit;
        }
        .cmd-ghost {
            position: absolute;
            inset: 0;
            color: var(--dim-color);
            opacity: 0.65;
            pointer-events: none;
            white-space: pre;
        }
        .cmd-input {
            position: relative;
            z-index: 1;
            width: 100%;
            caret-color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="terminal-body" id="termbody">
        <div class="input-line" id="actinputline">
            <span class="prompt-label" id="promptPath">system@butterlabs.app&gt;</span>
            <div class="input-wrap">
                <span class="cmd-ghost" id="cmdGhost" aria-hidden="true"></span>
                <input type="text" id="cmdInput" class="cmd-input" autocomplete="off" spellcheck="false" autofocus />
            </div>
        </div>
    </div>
 <script>
          class TerminalEngine {
            constructor() {
              this.promptStr = "system@butterlabs.app>";
                this.history = [];
              this.historyIdx = -1;
                this.commands = new Map();

              this.termBody = document.getElementById("termbody");
              this.activeInputLine = document.getElementById("actinputline");
                this.cmdInput = document.getElementById("cmdInput");
                this.cmdGhost = document.getElementById("cmdGhost");
              this.promptPath = document.getElementById("promptPath");

                this.setupEventListeners();
                this.updatePromptDisplay();
         };
         get API() {
            return {
            write: (text, className = '') => this.appendLine(text, className),
            error: (text) => this.appendLine(text, 'line-error'),
            accent: (text) => this.appendLine(text, 'line-accent'),
            dim: (text) => this.appendLine(text, 'line-dim'),
            rainbow: (text) => this.appendLine(text, 'rainbow'),
            gradient: (text, colors) => this.appendLine(text, `gradient/${colors.join('/')}`),
            clear: () => this.clearLines(),
            getPrompt: () => this.promptStr,
            setPrompt: (str) => {
                this.promptStr = str;
                this.updatePromptDisplay();
            },
            commands: this.commands
         };

         }
         registerCommand({ name, description, usage = '', aliases = [], execute }) {
                const cmdObj = { name, description, usage, execute };
                this.commands.set(name.toLowerCase(), cmdObj);
                aliases.forEach(alias => this.commands.set(alias.toLowerCase(), cmdObj));
        }
        updatePromptDisplay() {
                this.promptPath.textContent = this.promptStr;
        }
        appendLine(text, className = '') {
                const div = document.createElement('div');
                const classTokens = className.split(/\s+/).filter(Boolean);
                const gradientToken = classTokens.find(token => token.toLowerCase().startsWith('gradient/'));
                const gradientColors = gradientToken
                    ? gradientToken.split('/').slice(1).filter(color => /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color))
                    : [];
                const hasGradient = gradientColors.length >= 2;
                const hasRainbow = classTokens.includes('rainbow');
                const regularClasses = classTokens.filter(token => token !== 'rainbow' && !token.toLowerCase().startsWith('gradient/'));

                div.className = ['line', ...regularClasses].join(' ');
                if (hasRainbow) div.classList.add('line-rainbow');
                if (hasGradient) {
                    div.classList.add('line-gradient');
                    const gradientCycle = gradientColors.join(', ');
                    div.style.setProperty('--line-gradient', `${gradientCycle}, ${gradientColors[0]}`);
                }
                div.textContent = text;
                this.termBody.insertBefore(div, this.activeInputLine);
                window.scrollTo(0, document.body.scrollHeight);
        }
        clearLines() {
                const lines = this.termBody.querySelectorAll('.line');
                lines.forEach(l => l.remove());
        }
                    processCommand(rawInput) {
                const input = rawInput.trim();
                if (!input) return;

                this.appendLine(`${this.promptStr} ${input}`, 'line-prompt');
                this.history.push(input);
                this.historyIdx = this.history.length;

                const parts = input.split(/\s+/);
                const cmdName = parts[0].toLowerCase();
                const args = parts.slice(1);

                const cmdObj = this.commands.get(cmdName);
                if (cmdObj) {
                    try {
                        cmdObj.execute(args, this.API);
                    } catch (e) {
                        this.appendLine(`Error executing command: ${e.message}`, 'line-error');
                    }
                } else {
                    this.appendLine(`'${cmdName}' is not recognized as an internal command`, 'line-error');
                }
            }
        handleTabAutocomplete() {
                if (this.cmdGhost.dataset.completion) {
                    this.cmdInput.value = this.cmdGhost.dataset.completion + ' ';
                    this.updateAutocomplete();
                }
            }
            updateAutocomplete() {
                const currentVal = this.cmdInput.value;
                const parts = currentVal.split(/\s+/);
                const commandPart = parts.length === 1 ? parts[0].toLowerCase() : '';
                const matches = commandPart
                    ? [...new Set(Array.from(this.commands.keys()).filter(c => c.startsWith(commandPart)))]
                    : [];

                this.cmdGhost.textContent = '';
                this.cmdGhost.dataset.completion = '';
                if (matches.length === 1 && matches[0] !== commandPart) {
                    const completion = matches[0];
                    const prefix = document.createElement('span');
                    prefix.style.visibility = 'hidden';
                    prefix.textContent = commandPart;
                    this.cmdGhost.append(prefix, document.createTextNode(completion.slice(commandPart.length)));
                    this.cmdGhost.dataset.completion = completion;
                }
            }

            setupEventListeners() {
                this.cmdInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const val = this.cmdInput.value;
                        this.cmdInput.value = '';
                        this.updateAutocomplete();
                        this.processCommand(val);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.historyIdx > 0) {
                            this.historyIdx--;
                            this.cmdInput.value = this.history[this.historyIdx] || '';
                            this.updateAutocomplete();
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.historyIdx < this.history.length - 1) {
                            this.historyIdx++;
                            this.cmdInput.value = this.history[this.historyIdx] || '';
                            this.updateAutocomplete();
                        } else {
                            this.historyIdx = this.history.length;
                            this.cmdInput.value = '';
                            this.updateAutocomplete();
                        }
                    } else if (e.key === 'Tab') {
                        e.preventDefault();
                        this.handleTabAutocomplete();
                    }
                });

                this.cmdInput.addEventListener('input', () => this.updateAutocomplete());

                document.body.addEventListener('click', () => {
                    this.cmdInput.focus();
                });
            }
        }
        // create a terminal opject
        const terminal = new TerminalEngine();
        // help command that lists all available commands
        terminal.registerCommand({
            name: 'help',
            description: 'Displays a list of available commands',
            execute: (args, term) => {
                term.accent('==== Available Commands ====');
                const registered = new Map();
                
                term.commands.forEach((cmdObj) => registered.set(cmdObj.name, cmdObj));
                registered.forEach((cmdObj) => {
                    const usageStr = cmdObj.usage ? ` ${cmdObj.usage}` : '';
                    term.write(`  ${(cmdObj.name + usageStr).padEnd(20)} - ${cmdObj.description}`);
                });
            }
        });
        terminal.registerCommand({
            name: 'styles',
            description: 'Displays examples for animated terminal text',
            execute: (args, term) => {
                term.write("terminal.appendLine('text', 'rainbow');", 'line-dim');
                term.write("terminal.appendLine('text', 'gradient/#ff0055/#00e5ff/#ffe600');", 'line-dim');
                term.write("term.rainbow('text');", 'line-dim');
                term.write("term.gradient('text', ['#ff0055', '#00e5ff', '#ffe600']);", 'line-dim');
            }
        });
        // cls command that clears the terminal screen
        terminal.registerCommand({
            name: 'cls',
            description: 'Clears the terminal screen',
            aliases: ['clear'],
            execute: (args, term) => {
                term.clear();
            }
        });
        // echo command that prints text to the terminal
        terminal.registerCommand({
            name: 'echo',
            description: 'Prints text to terminal',
            usage: '<text>',
            execute: (args, term) => {
                term.write(args.join(' '));
            }
        });
        // date command that displays the current date and time
        terminal.registerCommand({
            name: 'date',
            description: 'Displays current date and time',
            execute: (args, term) => {
                term.accent(new Date().toString());
            }
        });
        // ver command that displays the operating system version
        terminal.registerCommand({
            name: 'ver',
            description: 'Displays operating system version',
            execute: (args, term) => {
                term.write('ButterOS Version 1.0.0');
            }
        });
        // eval command that evaluates an equatlion
        terminal.registerCommand({
            name: 'eval',
            description: 'Evaluates a mathematical expression',
            usage: '<expression>',
            execute: (args, term) => {
                try {
                    const result = eval(args.join(' '));
                    term.write(result.toString());
                } catch (error) {
                    term.error('Error evaluating expression');
                }
            }
        });
        // eval command that evaluates an equatlion
        terminal.registerCommand({
            name: 'evaluate',
            description: 'Evaluates a mathematical expression',
            usage: '<expression>',
            execute: (args, term) => {
                try {
                    const result = eval(args.join(' '));
                    term.write(result.toString());
                } catch (error) {
                    term.error('Error evaluating expression');
                }
            }
        });
        terminal.registerCommand({
            name: 'theme',
            description: 'Change terminal theme',
            usage: '<matrix|cyberpunk|classic|amber>',
            execute: (args, term) => {
            const themes = {
                matrix: { bg: '#0d0208', text: '#00ff66', prompt: '#003b00', accent: '#00ff66' },
                cyberpunk: { bg: '#1a1c23', text: '#ff79c6', prompt: '#8be9fd', accent: '#f1fa8c' },
                classic: { bg: '#000000', text: '#ffffff', prompt: '#aaaaaa', accent: '#ffff00' },
                amber: { bg: '#1e1000', text: '#ffb000', prompt: '#ff8000', accent: '#fff000' }
            };
            const choice = args[0]?.toLowerCase();
            if (themes[choice]) {
                const root = document.documentElement;
                root.style.setProperty('--bg-color', themes[choice].bg);
                root.style.setProperty('--text-color', themes[choice].text);
                root.style.setProperty('--prompt-color', themes[choice].prompt);
                root.style.setProperty('--accent-color', themes[choice].accent);
                term.accent(`Theme changed to ${choice}`);
            } else {
                term.error(`Available themes: ${Object.keys(themes).join(', ')}`);
            }
        }
        });
                // List files
        terminal.registerCommand({
            name: 'ls',
            description: 'List all files in the virtual directory',
            execute: (args, term) => {
                const files = fs.list();
                if (files.length === 0) {
                    term.dim('Directory is empty.');
                    return;
                }
                term.accent('==== Files ====');
                files.forEach(file => term.write(`  ${file}`));
            }
        });

        // Create an empty file
        terminal.registerCommand({
            name: 'touch',
            description: 'Create a new empty file',
            usage: '<filename>',
            execute: (args, term) => {
                const filename = args[0];
                if (!filename) return term.error('Usage: touch <filename>');
                
                if (fs.exists(filename)) {
                    term.dim(`Updated timestamp on ${filename}`);
                } else {
                    fs.write(filename, '');
                    term.accent(`Created file: ${filename}`);
                }
            }
        });

        // Read file contents
        terminal.registerCommand({
            name: 'cat',
            description: 'Display content of a file',
            usage: '<filename>',
            execute: (args, term) => {
                const filename = args[0];
                if (!filename) return term.error('Usage: cat <filename>');

                if (!fs.exists(filename)) {
                    return term.error(`File not found: '${filename}'`);
                }
                const content = fs.read(filename);
                term.write(content || '(empty file)');
            }
        });

        // Simple text editor via browser prompt window
        terminal.registerCommand({
            name: 'edit',
            description: 'Edit a file content using a popup editor',
            usage: '<filename>',
            execute: (args, term) => {
                const filename = args[0];
                if (!filename) return term.error('Usage: edit <filename>');

                const currentContent = fs.exists(filename) ? fs.read(filename) : '';
                const newContent = prompt(`Editing '${filename}':`, currentContent);

                if (newContent !== null) { // Null means the user hit 'Cancel'
                    fs.write(filename, newContent);
                    term.accent(`Saved ${filename}`);
                } else {
                    term.dim('Edit canceled.');
                }
            }
        });

        // Delete a file
        terminal.registerCommand({
            name: 'rm',
            description: 'Delete a file',
            usage: '<filename>',
            execute: (args, term) => {
                const filename = args[0];
                if (!filename) return term.error('Usage: rm <filename>');

                if (fs.remove(filename)) {
                    term.accent(`Removed ${filename}`);
                } else {
                    term.error(`File not found: '${filename}'`);
                }
            }
        });
        // excicut javascript
        terminal.registerCommand({
            name: 'execute',
            description: 'Execute JavaScript code',
            usage: '<code>',
            execute: (args, term) => {
                try {
                    const code = args.join(' ');
                    const result = eval(code);
                    term.write(result !== undefined ? result.toString() : 'undefined');
                } catch (error) {
                    term.error(`Error executing JavaScript: ${error.message}`);
                }
            }
        });
        // allas
        terminal.registerCommand({
            name: 'js',
            description: 'Execute JavaScript code',
            usage: '<code>',
            execute: (args, term) => {
                try {
                    const code = args.join(' ');
                    const result = eval(code);
                    term.write(result !== undefined ? result.toString() : 'undefined');
                } catch (error) {
                    term.error(`Error executing JavaScript: ${error.message}`);
                }
            }
        });
        function initTerminal() {
            terminal.appendLine('Welcome to ButterOS CMD\n', 'rainbow');
            terminal.appendLine('(c) ButterLabs | All rights reserved.\n');
            terminal.appendLine('Type "help" to view available commands.\n', 'line-dim');
            document.getElementById('cmdInput').focus();
        }
        initTerminal();
        // file sys tem 
        class VirtualFileSystem {
    constructor(storageKey = 'butterOS_fs') {
        this.storageKey = storageKey;
        this.files = this.load();
    }

    load() {
        try {
            const data = localStorage.getItem(this.storageKey);
            return data ? JSON.parse(data) : {
                'welcome.txt': 'Welcome to ButterOS! Files created here persist across page refreshes.'
            };
        } catch (e) {
            return {};
        }
    }


    save() {
        try {
            localStorage.setItem(this.storageKey, JSON.stringify(this.files));
        } catch (e) {
            console.error('Failed to sync filesystem to storage', e);
        }
    }

    exists(filename) {
        return Object.prototype.hasOwnProperty.call(this.files, filename);
    }

    write(filename, content = '') {
        this.files[filename] = content;
        this.save();
    }

    read(filename) {
        return this.files[filename];
    }

    remove(filename) {
        if (this.exists(filename)) {
            delete this.files[filename];
            this.save();
            return true;
        }
        return false;
    }

    list() {
        return Object.keys(this.files);
    }
}


const fs = new VirtualFileSystem();
    </script>
</body>
</html>
