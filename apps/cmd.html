<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMD</title>
    <style>
        /* Finnialy learned how to use css varibles */
        :root{
            --bg-color: #000000;
            --text-color: #06f56a;
            --prompt-color: #00e1fe;
            --dim-color: #2fa23c;
            --error-color: #ff1100;
            --accent-color: #ffc800;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body  {
            /* hide the scroll bar because it looks ugly */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        /* some code ai gave just incase scroll bar dosent hide */
        ::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        body {
            /* use the css variables that i made eariler */
            background-color: var(--bg-color);
            color: var(--text-color);
            font: 15px/1.4 'comic sans ms', 'Courier New', Courier, monospace;
            height: 100vh;
            padding: 16px;
            overflow-y: auto;
        }
        .line {
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .line-prompt, .prompt-label { 
            color: var(--prompt-color); 
            font-weight: bold; 
        }
        .line-error { 
            color: var(--error-color); 
        }
        .line-accent { 
            color: var(--accent-color); 
        }
        .line-dim { 
            color: var(--dim-color); 
        }
        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: inherit;
            font: inherit;
            caret-color: var(--text-color);
        }
    </style>
</head>
<body>
    
</body>
</html>
