<!DOCTYPE html>
<html>
  <head>
    <title>ButterOS Music</title>
    <style>
      :root {
  color-scheme: dark;
  --bg: #0b0f14;
  --surface: #121922;
  --surface-hover: #182231;
  --border: #2a3645;
  --text: #f2f7fb;
  --muted: #d8d0d0;
  --accent: #dcde93;
  --accent-hover: var(--accent-dark);
  --focus: rgba(45, 220, 104, 0.28);
    --accent-color: #dcde93;
    --accent-gradient: linear-gradient(135deg, #dcde93, #dea193);
    --accent-dark: #75764d;
    --accent-gradient-dark: linear-gradient(135deg, #75764d, #88635a);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-image: var(--accent-gradient-dark);
  scrollbar-width: none;
  -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
  padding: clamp(16px, 3vw, 32px);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

input {
  width: 100%;
  min-width: 0;
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-radius: 1000px;
  outline: none;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
}

input::placeholder {
  color: var(--muted);
}

input:hover {
  background: var(--accent-dark);
}

input:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 4px var(--accent-dark);
}

.inputbtn {
  align-self: flex-start;
  padding: 12px 20px;
  border: 0;
  border-radius: 100px;
  background: var(--accent-dark);
  color: #fffefe;
  cursor: pointer;
  font: inherit;
  
  font-weight: 700;
  letter-spacing: 0.01em;
  box-shadow: 0 8px 20px rgba(45, 220, 104, 0.18);
  transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
}

.inputbtn:hover {
  background: var(--accent-hover);
  box-shadow: 0 10px 24px rgba(45, 220, 104, 0.26);
  transform: translateY(-1px);
}

.inputbtn:active {
  transform: translateY(0);
}

.inputbtn:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}

iframe {
  display: block;
  width: 100%;
  min-height: 0;
  flex: 1;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
}

#cached-songs {
  flex: 0 0 auto;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
}

#cached-songs h2 {
  margin-bottom: 10px;
  font-size: 1rem;
}

#songlist {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.cached-song {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 1000px;
  background: var(--surface-hover);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}

.cached-song:hover,
.cached-song:focus-visible {
  border-color: var(--accent);
  outline: none;
}

.empty-song-list {
  color: var(--muted);
  font-size: 0.9rem;
}
    </style>
  </head>
  <body>
    <!-- playlist input -->
    <input type="text" class="inputbtn" id="playlistinput" placeholder="Enter playlist name">
    <button id="loadplaylistbutton">Load Playlist</button> 
     <h6 style="color: rgb(255, 255, 255);">Playlists can be created and managed at <a href="https://streamables.butterlabs.app/" target="_blank" rel="noopener noreferrer">Streamables</a></h6>
     <!-- indiv track input -->
    <input type="text" class="inputbtn" id="trackinput" placeholder="Enter track name">
    <button id="loadtrackbutton">Load Track</button> 
    <!-- file upload -->
    <input type="file" accept=".mp3,audio/mpeg" class="inputbtn" id="fileinput" placeholder="Enter playlist name">
    <button  id="musicupload">Upload Music</button> 
    <!-- reminder -->
    <section id="cached-songs" aria-labelledby="cached-songs-title">
      <h2 id="cached-songs-title">Cached Songs</h2>
      <div id="songlist">
        <p class="empty-song-list">No cached songs yet.</p>
      </div>
    </section>
    <iframe 
      src="https://streamables.blrc.me/embed/equinoxtds" 
      title="Playlist test1" 
      allow="autoplay"
      referrerpolicy="no-referrer">
    </iframe>
    <script>
      const inpt = document.getElementById("playlistinput");
const inpt2 = document.getElementById("trackinput");
const inpt3 = document.getElementById("fileinput");
const btn = document.getElementById("loadplaylistbutton");
const btn2 = document.getElementById("loadtrackbutton");
const btn3 = document.getElementById("musicupload");
const iframe = document.querySelector("iframe");
const LOCAL_SONG_CACHE = "butteros-local-songs-v1";
const LOCAL_SONG_PREFIX = "local-song:";

const getCloudStorageEnabled = () => localStorage.getItem("storeSongsInCloud") !== "false";

const openLocalSongCache = () => caches.open(LOCAL_SONG_CACHE);

const localSongUrl = (id) => new URL(`./.butteros-local-songs/${encodeURIComponent(id)}`, window.location.href).href;

const loadLocalSong = async (id) => {
    const cache = await openLocalSongCache();
    const response = await cache.match(localSongUrl(id));
    if (!response) return;
    const blob = await response.blob();
    iframe.src = URL.createObjectURL(blob);
};

const playSong = (songId) => {
    if (songId.startsWith(LOCAL_SONG_PREFIX)) {
        loadLocalSong(songId.slice(LOCAL_SONG_PREFIX.length));
    } else {
        iframe.src = `https://streamables.blrc.me/embed/${encodeURIComponent(songId)}`;
    }
};

btn.addEventListener("click", () => {
    const playlistname = inpt.value.trim();
    if (playlistname) {
        iframe.src = `https://streamables.blrc.me/embed/playlist/${playlistname}`;
    } else {
        alert("Enter a valid playlist name");
    }
});
btn2.addEventListener("click", () => {
    const trackname = inpt2.value.trim();
    if (trackname) {
        iframe.src = `https://streamables.blrc.me/embed/${trackname}`;
    } else {
        alert("Enter a valid track name");
    }
});
btn3.addEventListener("click", async () => {
    const file = inpt3.files[0];
    if (file) {
        const name2 = prompt("Enter a name for your track:");
        if (!name2) return;
        if (getCloudStorageEnabled()) {
            try {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("name", name2);
                formData.append("protected", "false");
                const response = await fetch("https://streamables.blrc.me/upload", {
                    method: "POST",
                    body: formData
                });
                if (!response.ok) throw new Error("Cloud upload failed");
                iframe.src = `https://streamables.blrc.me/embed/${encodeURIComponent(name2)}`;
                try {
                    saveSongToCache(name2);
                } catch (error) {
                    console.warn("Uploaded track, but could not save it to the song list", error);
                }
                alert("Track uploaded successfully!");
            } catch (error) {
                console.error(error);
                alert("Cloud upload failed. Check your connection and try again.");
            }
        } else {
            try {
                const localId = `${Date.now()}-${crypto.randomUUID()}`;
                const songBytes = await file.arrayBuffer();
                if (songBytes.byteLength !== file.size) {
                    throw new Error("The complete song could not be read");
                }
                const cache = await openLocalSongCache();
                await cache.put(localSongUrl(localId), new Response(songBytes, {
                    headers: {
                        "Content-Type": file.type || "audio/mpeg",
                        "Content-Length": String(songBytes.byteLength),
                        "X-Song-Name": encodeURIComponent(name2),
                        "X-Song-Size": String(songBytes.byteLength)
                    }
                }));
                const storedSong = await cache.match(localSongUrl(localId));
                if (!storedSong || (await storedSong.arrayBuffer()).byteLength !== file.size) {
                    await cache.delete(localSongUrl(localId));
                    throw new Error("The complete song was not saved to browser cache");
                }
                saveSongToCache(`${LOCAL_SONG_PREFIX}${localId}`, name2);
                await loadLocalSong(localId);
                alert(`Entire track saved locally (${file.size} bytes).`);
            } catch (error) {
                console.error(error);
                alert("Could not save the track locally. Check available browser storage and try again.");
            }
        }
    } else {
        alert("Please select a file to upload.");
    }
});
// save uploaded song ids to a cache so that they can be loaded later
const songCache = new Map();

const renderSongList = () => {
    const songList = document.getElementById("songlist");
    if (!songList) return;

    songList.replaceChildren();
    songCache.forEach((value, key) => {
        const songItem = document.createElement("button");
        songItem.type = "button";
        songItem.className = "cached-song";
        songItem.textContent = value.name || key;
        songItem.addEventListener("click", () => {
            playSong(key);
        });
        songList.appendChild(songItem);
    });

    if (songCache.size === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "empty-song-list";
        emptyMessage.textContent = "No cached songs yet.";
        songList.appendChild(emptyMessage);
    }
};
// load song ids from cache on page load
window.addEventListener("load", async () => {
    const cachedSongs = localStorage.getItem("songs");
    if (cachedSongs) {
        try {
            const songIds = JSON.parse(cachedSongs);
            songIds.forEach((song) => {
                if (typeof song === "string") songCache.set(song, { name: song });
                else if (song && song.id) songCache.set(song.id, song);
            });
        } catch (error) {
            console.error("Could not read saved song list", error);
        }
    }
    // load the first song in the cache if it exists
    if (songCache.size > 0) {
        const firstSongId = songCache.keys().next().value;
        playSong(firstSongId);
    }
    renderSongList();
});
const saveSongToCache = (songId, name = songId) => {
    songCache.set(songId, { name });
    const songIds = Array.from(songCache, ([id, song]) => ({ id, name: song.name }));
    localStorage.setItem("songs", JSON.stringify(songIds));
    renderSongList();
};

    </script>
  </body>
</html>
