<!DOCTYPE html>
<head>
  <title>Notes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #noteInput {
      width: 300px;
      padding: 10px;
      margin-bottom: 10px;
    }
    #sidebar {
      padding: 10px;
      width: 200px;
      float: left;
      margin-right: 20px;
      border-radius: 25px;
      background-color: rgba(0,0, 0,0.1);
    }
  </style>
</head>
<body> 
    <input type="text" id="noteInput" placeholder="Type your note here...">
    <button id="saveNoteButton">Save Note</button>
    <button id="deleteNoteButton">Delete Note</button>
    <sidebar id="sidebar">
        <h3>Notes</h3>
        <ul id="notesList"></ul>
    </sidebar>
    <script src="note/notes.js"></script>
</body>
