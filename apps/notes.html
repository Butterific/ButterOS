<!DOCTYPE html>
<head>
  <title>Notes</title>
  <style>
    body {
      font-family: Comic Sans MS, sans-serif;
      margin: 20px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 1) 0%, rgb(242, 255, 0) 100%);
    }
    #noteInput {
      width: 300px;
      padding: 10px;
      margin-bottom: 10px;
      padding: 10px;
    }
    #saveNoteButton { 
      border: solid 1px #ccc;
      border-radius: 5px;
      padding: 10px;
    }
    #deleteNoteButton { 
      border: solid 1px #ccc;
      border-radius: 5px;
      color: white;
      background-color: red;
      padding: 10px;
    }
    #saveNoteButton:hover { 
      border: solid 1px #ccc;
      border-radius: 5px;
      background-color: rgb(50, 181, 50);
      color: white;
    }
    #deleteNoteButton:hover { 
      border: solid 1px #ccc;
      border-radius: 5px;
      color: white;
      background-color: rgb(181, 50, 50);
    }
    #saveNoteButton:active { 
      border: solid 1px #ccc;
      border-radius: 5px;
      background-color: rgb(28, 99, 28);
      color: white;
    }
    #deleteNoteButton:active { 
      border: solid 1px #ccc;
      border-radius: 5px;
      color: white;
      background-color: rgb(112, 31, 31);
    }
    #sidebar {
      padding: 10px;
      width: 200px;
      float: left;
      margin-right: 20px;
      border-radius: 25px;
      background-color: rgba(0,0, 0,0.1);
    }
  </style>
</head>
<body> 
    <input type="text" id="noteInput" placeholder="Type your note here...">
    <button id="saveNoteButton">Save Note</button>
    <button id="deleteNoteButton">Delete Note</button>
    <sidebar id="sidebar">
        <h3>Notes</h3>
        <h6>Enter a note and click "Save Note" to add it to the list.</h6>
        <ul id="notesList"></ul>
    </sidebar>
    <script>
const noteInput = document.getElementById('noteInput');
const saveNoteButton = document.getElementById('saveNoteButton');
const deleteNoteButton = document.getElementById('deleteNoteButton');
const notesList = document.getElementById('notesList');

function savenotestocache() {
  const notes = [];
  notesList.querySelectorAll('li').forEach((li) => {
    notes.push(li.dataset.note);
  });
  localStorage.setItem('notes', JSON.stringify(notes));
}

function addNoteToList(note) {
  const li = document.createElement('li');
  li.dataset.note = note;
  li.textContent = note;
  notesList.appendChild(li);
  renumberNotes();
}

function renumberNotes() {
  notesList.querySelectorAll('li').forEach((li, index) => {
    li.textContent = `${index + 1}. ${li.dataset.note}`;
  });
}

function loadNotesFromCache() {
  const cachedNotes = localStorage.getItem('notes');
  if (!cachedNotes) {
    return;
  }

  const notes = JSON.parse(cachedNotes);
  if (!Array.isArray(notes)) {
    return;
  }

  notes.forEach((note) => {
    addNoteToList(note);
  });
}

saveNoteButton.addEventListener('click', () => {
  const note = noteInput.value;
  if (note) {
    addNoteToList(note);
    noteInput.value = '';
    savenotestocache();
  }
});
deleteNoteButton.addEventListener('click', () => {
  const noteNumber = Number.parseInt(noteInput.value.trim(), 10);
  const selectedNote = Number.isInteger(noteNumber) && noteNumber > 0
    ? notesList.querySelectorAll('li')[noteNumber - 1]
    : notesList.querySelector('li.selected');
  if (selectedNote) {
    notesList.removeChild(selectedNote);
    renumberNotes();
    noteInput.value = '';
    savenotestocache();
  }
});
notesList.addEventListener('click', (event) => {
  if (event.target.tagName === 'LI') {
    notesList.querySelectorAll('li').forEach((li) => {
      li.classList.remove('selected');
    });
    event.target.classList.add('selected');
  }
});
loadNotesFromCache();

    </script>
</body>
