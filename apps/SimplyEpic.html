<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>simply epic trust</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{
    --accent-color: #dcde93;
    --accent-gradient: linear-gradient(135deg, #dcde93, #dea193);
    --accent-dark: #75764d;
    --accent-gradient-dark: linear-gradient(135deg, #75764d, #88635a);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-image: var(--accent-gradient-dark);
        }
    </style>
</head>
<body>
    <script async src="https://cse.google.com/cse.js?cx=613eb6f6a738f49db"></script>
    <div class="gcse-search"></div>

    <script>
        // Intercept all link clicks and open in popup
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (target && target.href) {
                e.preventDefault();
                window.open(target.href, '_blank');
            }
        }, true);
    </script>
</body>
</html>
