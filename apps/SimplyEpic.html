<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8f8f8;
        }

        #navbar {
            background-color: #4285f4;
            padding: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #address-bar {
            flex-grow: 2;
            margin: 0 10px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #go-button {
            cursor: pointer;
            color: white;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        #browser-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #browser-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="navbar">
        <input type="text" id="address-bar" placeholder="Search with Google or enter URL (add Https)"> 
        <button id="go-button" onclick="navigate()">Go</button>
    </div>

    <div id="browser-container">
        <iframe id="browser-frame" src="https://www.google.com/webhp?igu=1"></iframe>
    </div>

    <script>
        function navigate() {
            var url = document.getElementById('address-bar').value;
            document.getElementById('browser-frame').src = url;
        }
    </script>
</body>
</html>
