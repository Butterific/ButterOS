<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8f8f8;
        }
    </style>
</head>
<body>
    <script async src="https://cse.google.com/cse.js?cx=613eb6f6a738f49db"></script>
    <div class="gcse-search"></div>

    <script>
        // Intercept all link clicks and open in popup
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (target && target.href) {
                e.preventDefault();
                window.open(target.href, 'popup', 'width=800,height=600,scrollbars=yes,resizable=yes');
            }
        }, true);
    </script>
</body>
</html>
