<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🅂🄸🄼🄿🄻🅈🄴🄿🄸🄲</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f8f8f8;
        }

        #navbar {
            background-color: #4285f4;
            padding: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #open-popup-button {
            flex-grow: 1; /* Take up available space */
            cursor: pointer;
            color: white;
            padding: 8px;
            background-color: #555;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        #address-bar {
            flex-grow: 2; /* Adjusted flex-grow */
            margin: 0 10px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #go-button {
            cursor: pointer;
            color: white;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        #browser-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #browser-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #warning {
            background-color: #ff9999;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 0;
            border-bottom: 1px solid #ddd;
        }

        #created-by {
            background-color: #f1f1f1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="navbar">
        <div id="open-popup-button" onclick="openPopup()">Open Popup</div>
        <input type="text" id="address-bar" placeholder="Search with Google or enter URL (add Https)"> 
        <button id="go-button" onclick="navigate()">Go</button>
    </div>

    <div id="browser-container">
        <iframe id="browser-frame" src="https://www.google.com/webhp?igu=1"></iframe>
    </div>

    <div id="warning">
        <p>Warning: Some websites may not work properly due to security restrictions.</p>
    </div>

    <div id="created-by">
        <p>Created By Malay Gupta! </p>
    </div>

    <script>
        function openPopup() {
            var currentURL = document.getElementById('browser-frame').src;
            window.open(currentURL, '_blank', 'width=600,height=400');
        }

        function navigate() {
            var url = document.getElementById('address-bar').value;
            document.getElementById('browser-frame').src = url;
        }
    </script>
</body>
</html>
