 <doctype html>
<html>
<head>
    <title>ButterOS Calculator</title>
    <link rel="stylesheet" href="calc/calculator.css">
    <style>
        body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
}
.calculator {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    font-family: "Comic Sans MS", cursive, sans-serif;
    background-color: #1cd880;
    overflow: hidden;
}
#display {
    width: 100%;
    box-sizing: border-box;
    padding: 20px;
    font-size: 5rem;
    text-align: right;
    background-color: #000000;
    font-family: "Comic Sans MS", cursive, sans-serif;
    color:#1cd880;
}
#keys{
    flex: 1;
    min-height: 0;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 10px;
    padding: 25px;
}
button {
    min-height: 0;
    width: 100%;
    height: 100%;
    /* border-radius: 50px; */
    border: rgb(14, 177, 14) 5px inset;
    background-color:#1cd880 ;
    color: darkgreen;
    font-size: 60px;
    font-family: "Comic Sans MS", cursive, sans-serif;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background-color: #8fbca7;
    color: darkgreen;
    border: rgb(14, 177, 14) 5px outset;
    
}
button:active {
    background-color: #2fd81c;
    color: darkgreen;
    border: rgb(14, 177, 14) 5px inset;
}
.operator-btn {
    background-color: #1ccbd8;
    color: rgb(3, 64, 231);
    border: rgb(14, 177, 14) 5px inset;
}
.operator-btn:hover {
    background-color: #0e83c6;
    color: rgb(21, 221, 191);
    border: rgb(14, 177, 14) 5px outset;
}
.operator-btn:active { 
    background-color: #1f1cd8;
    color: rgb(42, 10, 156);
    border: rgb(14, 177, 14) 5px inset;
}
    </style>
</head>
<body>
    <div class="calculator">
        <input id="display" pattern="[0-9\s!@#$%^&*()_\-+={[}\]|:;'<>,.?\/~`]+" 
  oninput="this.value = this.value.replace(/[^0-9!@#$%^&*()_\-+={[}\]|:;'<>,.?\/~`]/g, '');">
        <div id="keys">
            <button onclick="appendtodisplay('+')" class="operator-btn">+</button>
            <button onclick="appendtodisplay('7')">7</button>
            <button onclick="appendtodisplay('8')">8</button>
            <button onclick="appendtodisplay('9')">9</button>
            <button onclick="appendtodisplay('-')" class="operator-btn">-</button>
            <button onclick="appendtodisplay('4')">4</button>
            <button onclick="appendtodisplay('5')">5</button>
            <button onclick="appendtodisplay('6')">6</button>
            <button onclick="appendtodisplay('*')" class="operator-btn">*</button>
            <button onclick="appendtodisplay('1')">1</button>
            <button onclick="appendtodisplay('2')">2</button>
            <button onclick="appendtodisplay('3')">3</button>
            <button onclick="appendtodisplay('/')" class="operator-btn">/</button>
            <button onclick="appendtodisplay('0')">0</button>
            <button onclick="appendtodisplay('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="clearDisplay()" class="operator-btn">C</button>
        </div>
    </div>
</body>
<script src="calc/calculator.js"></script>
</html>
