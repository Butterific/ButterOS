<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>games</title>
  <style>
    body {
  margin: 0;
  padding: 0;
  background-color: #000;
  min-height: 100vh;
  position: relative;
}
.center-box {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: brightness(100%) contrast(100%) opacity(100%) saturate(100%);
  padding: 20px;
  border-radius: 10px;
  z-index: 15;
  color: white;
  font-family: Knewave, sans-serif;
  font-size: 19px;
  background: rgba(255, 255, 255, 0.15); 
  backdrop-filter: blur(12px) saturate(180%) brightness(110%);
  -webkit-backdrop-filter: blur(12px) saturate(180%) brightness(110%);
}
.scrollable-element {
  overflow: auto;
  &::-webkit-scrollbar {
    display: none;
  }
  scrollbar-width: none;
  -ms-overflow-style: none;
  z-index: 14;
}

  </style>
</head>
<body>
    <div class="center-box">
        <div id="project-list" class="scrollable-element" style="background: rgba(0, 0, 0, 0.3); backdrop-filter: brightness(100%) contrast(100%) opacity(100%) saturate(100%); font-family: 'Knewave', cursive, sans-serif; line-height: 1.6; margin-top: 10px; height: 41vh; overflow-y: auto; overflow-x: hidden; padding: 0 25px 10px 10px; box-sizing: border-box; width: 100%; padding-top: 5px;">
        loading projects...
        </div>
    </div>
  <script>
document.addEventListener("DOMContentLoaded", () => {
    let e = document.getElementById("project-list");

    fetch("projects.json")
        .then(res => {
            if (!res.ok) throw Error("Network response was not ok");
            return res.json();
        })
        .then(t => {
            e.innerHTML = "";
            t.forEach(t => {
                let o = document.createElement("div");
                o.style.marginBottom = "8px";
                o.innerHTML = `
                    <a href="${t.url}" target="_blank" 
                       style="text-decoration:none; color:${t.color}; text-shadow:0 0 10px ${t.color}; font-weight:bold; display: inline-flex; align-items: center; gap: 4px; vertical-align: middle;">
                        ${t.name}     
                             <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a> 
                    - <span style="color: white; opacity: 0.9;">${t.description}</span> 
                    <hr style="border: none; height: 5px; background-color: ${t.color}; box-shadow: 0 0 10px ${t.color}; margin-top: 8px;">`;
                
                e.appendChild(o);
            });
        })
        .catch(err => {
            e.innerText = "Error loading projects failed";
            console.error("Error loading JSON:", err);
        });
});
  </script>
</body>
</html>
