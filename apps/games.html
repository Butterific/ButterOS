<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Knewave&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .center-box {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-radius: 10px;
      z-index: 15;
      color: #fff;
      font-family: 'Knewave', cursive, sans-serif;
      font-size: 19px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px) saturate(180%) brightness(110%);
      -webkit-backdrop-filter: blur(12px) saturate(180%) brightness(110%);
    }

    .scrollable-element {
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .scrollable-element::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    #project-list {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 5px 10px 10px 10px;
      background: rgba(0, 0, 0, 0.3);
      line-height: 1.6;
      z-index: 14;
    }

    .project {
      margin-bottom: 8px;
    }

    .project a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      text-decoration: none;
    }

    .project .desc {
      color: #fff;
      opacity: 0.9;
    }

    .project hr {
      border: none;
      height: 5px;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <div class="center-box">
    <div id="project-list" class="scrollable-element">
      loading projects...
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const list = document.getElementById("project-list");

      fetch("projects.json")
        .then(res => {
          if (!res.ok) throw Error("Network response was not ok");
          return res.json();
        })
        .then(projects => {
          list.innerHTML = "";
          projects.forEach(p => {
            const item = document.createElement("div");
            item.className = "project";
            item.innerHTML = `
              <a href="${p.url}" target="_blank" style="color:${p.color}; text-shadow:0 0 10px ${p.color};">
                ${p.name}
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
              </a>
              - <span class="desc">${p.description}</span>
              <hr style="background-color:${p.color}; box-shadow:0 0 10px ${p.color};">`;
            list.appendChild(item);
          });
        })
        .catch(err => {
          list.innerText = "Error loading projects";
          console.error("Error loading JSON:", err);
        });
    });
  </script>
</body>
</html>
