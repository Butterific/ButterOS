.ball {
    height: 30px;
    width: 30px;

        var(--accent-pink-dark), 4px 0 18px var(--accent-color);
}

.paddle {
    height: 100px;
    width: 18px;
    border-radius: 50%;
    position: fixed;
}

@keyframes rotateBarColors {
    0%, 100% {
        box-shadow: 
            inset 0 0 12px #fff,
            inset -4px -6px 20px var(--accent-pink-dark),
            inset 4px 6px 20px var(--accent-color),

    25% {

            inset 0 0 12px #fff,

            inset -4px 6px 20px var(--accent-color),
            0 0 14px #fff,
            4px -6px 20px var(--accent-pink-dark),
            -4px 6px 20px var(--accent-color);
    }
    50% {
        box-shadow: 
            inset 0 0 12px #fff,
            inset 4px 6px 20px var(--accent-pink-dark),
            inset -4px -6px 20px var(--accent-color),
            0 0 14px #fff,
            4px 6px 20px var(--accent-pink-dark),
            -4px -6px 20px var(--accent-color);
    }
    75% {
        box-shadow: 
            inset 0 0 12px #fff,
            inset -4px 6px 20px var(--accent-pink-dark),
            inset 4px -6px 20px var(--accent-color),
            0 0 14px #fff,
            -4px -6px 20px var(--accent-pink-dark),
            -4px -6px 20px var(--accent-color);
    }
}

.paddle_1 {
    top: calc(7.5vh + 55px);
    left: calc(10vw + 30px);
    width: 20px;          
    height: 120px;
    border-radius: 10px;  
    animation: rotateBarColors 4s linear infinite;
}

.paddle_2 {
    top: calc(7.5vh + 55px);
    right: calc(10vw + 30px);
    width: 20px;          
    height: 120px;
    border-radius: 10px;  
    animation: rotateBarColors 4s linear infinite;
}

.player_1_score {
    height: 50px;
    width: 50px;
    color: var(--accent-color);
    position: fixed;
    left: 30vw;
    margin-top: 30px;
}

.player_2_score {
    height: 50px;
    width: 50px;
    color: var(--accent-color);
    position: fixed;
    left: 70vw;
    margin-top: 30px;
}

.message {
    position: fixed;
    height: 10vh;
    width: 30vw;
    color: var(--accent-color);
    left: 38vw;
    margin: 30px auto auto auto;
}
    </style>
</head>
