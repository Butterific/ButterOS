<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Starry Night</title>
  <style>
    :root { color-scheme: dark; background: #080b14; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; }

    .milky-way {

    @keyframes nebula-breathe { 0%,100% { transform: translate3d(-.5%, 0, 0) scale(1); opacity: .75; } 50% { transform: translate3d(.5%, -1%, 0) scale(1.025); opacity: .9; } }
    @keyframes dust-breathe { 0%,100% { opacity: .25; } 50% { opacity: .4; } }
    @keyframes glow-breathe { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="Golden starry night sky above a dark mountain ridge">
    <div class="stars"></div>
    <div class="milky-way"></div>
    <div class="nebula"></div>
    <div class="dust"></div>
    <div class="horizon-glow"></div>
    <div class="ridge"></div>
    <div class="vignette"></div>
  </main>
</body>
</html>
