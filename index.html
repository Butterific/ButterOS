<!DOCTYPE html>
<html>
  <head>
    <title>ButterOS</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" href="./assets/logo.png">
  </head>
  <body>
    <link rel="stylesheet" href="index.css">
    <!-- topbar -->
    <div class="topbar">
      <p class="topbartext"><b>ButterOS</b></p> 
      <p class="topbartext" id="timeElement">Loading time...</p> 
    </div>
    <div id="desktopApps">
      <!-- calculator app icon -->
      <div class="appicon" onclick="opencalcapp()">
        <img src="./assets/app-icons/calculator.png" class="appiconimg" draggable="false">
        <p class="apptext">Calculator</p>
      </div>
      <!-- simplyepic app icon -->
      <div class="appicon" onclick="opensimplyepic()">
        <img src="./assets/app-icons/simplyepic.png" class="appiconimg" draggable="false"s>
        <p class="apptext">SimplyEpic</p>
      </div>
      <!-- music app icon -->
      <div class="appicon" onclick="openmusic()">
        <img src="./assets/app-icons/music.png" class="appiconimg" draggable="false"s>
        <p class="apptext">Music</p>
      </div>
      <!-- Info app icon -->
      <div class="appicon" onclick="openinfo()">
        <img src="./assets/app-icons/about.png" class="appiconimg" draggable="false"s>
        <p class="apptext">Info</p>
      </div>
    </div>

    <!-- desktop/welcomewindow -->
    <div class="welcome window">
      <div class="windowheader">
        <div class="windowdrag"> 
          <!-- toolbar -->
          <img id="drag" src="./assets/dragable.svg" />
        </div>
        <div class="closebutton">
          <img src="./assets/windowbar/close.png"/>
        </div>
      </div>
      <div class="window-box">
        <br>
        <!-- intro -->
        <img style="height: 64px" src="./assets/logo.png" />
        <h1>Welcome to ButterOS</h1>
        <h2>Introduction:</h2>
        <p>Welcome to <b>ButterOS</b>!</p>
        <p>Get started by closing this window and clicking one of the apps on the <b>desktop</b>!</p>
      </div>
    </div>
    <!-- calculator app -->
    <div class="window app-window" id="calcapp" style="display: none;">
      <div class="windowheader">
        <div class="windowdrag"> 
          <img style="width: 20px; height: 20px" src="./assets/dragable.svg" />
        </div>
        <div class="closebutton">
          <img src="./assets/windowbar/close.png"/>
        </div>
      </div>
      <div class="window-box">
         <iframe style="width: 100%; height: 100%; border: none;" class="app-frame" src="apps/calculator.html"></iframe>
      </div>
    </div>
    <!-- simplyepic app -->
    <div class="window app-window" id="sepic" style="display: none;">
      <div class="windowheader">
        <div class="windowdrag"> 
          <img style="width: 20px; height: 20px" src="./assets/dragable.svg" draggable="false"/>
        </div>
        <div class="closebutton">
          <img src="./assets/windowbar/close.png"/>
        </div>
      </div>
      <div class="window-box">
        <iframe class="app-frame" src="apps/SimplyEpic.html"></iframe>
      </div>
    </div>
    <!-- music app -->
    <div class="window app-window" id="music" style="display: none;">
      <div class="windowheader">
        <div class="windowdrag"> 
          <img style="width: 20px; height: 20px" src="./assets/dragable.svg" draggable="false"/>
        </div>
        <div class="closebutton">
          <img src="./assets/windowbar/close.png"/>
        </div>
      </div>
      <div class="window-box">
        <iframe class="app-frame" src="apps/music.html"></iframe>
      </div>
    </div>
    <!-- window taskbar script -->
    <script src="scripts/windowcontrol.js"></script>
    <!-- window drag script -->
    <script src="scripts/windowdrag.js"></script>
    <!-- time sync for toolbar -->
    <script src="scripts/timesync.js"></script>
    <!-- open apps -->
    <script src="scripts/openapp.js"></script>
  </body>
</html>
