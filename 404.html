<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta id="ascii" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>butterlabs</title>
	<meta name="description" content="butterlabs"> <meta property="og:title" content="butterlabs" />
    <meta property="og:description" content="butterlabs" />
    <meta property="og:image" content="https://picsum.photos/500" />
    <meta property="og:url" content="butterlabs.app" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffee8c" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
      html, body {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body {
        min-height: 100vh;
      }

      body.desktop-locked {
        overflow: hidden;
      }

      body.mobile-experience {
        overflow-y: auto;
        background: radial-gradient(circle at top, rgba(255, 238, 140, 0.15), rgba(0, 0, 0, 0.85));
      }

      .desktop-shell {
        position: relative;
        min-height: 100vh;
      }

      .mobile-shell {
        display: none;
      }

      body.mobile-experience .desktop-shell {
        display: none;
      }

      body.mobile-experience .mobile-shell {
        display: flex;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }

      #project-list {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      #project-list::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>

  <body class="bg-gray-900 text-gray-300 font-sans desktop-locked">

    <audio id="butter-audio" src="https://cdn.butterlabs.app/song.mp3" loop preload="auto" class="hidden" playsinline></audio>

    <div id="desktop-shell" class="desktop-shell">
      <div id="render-placeholder" class="fixed inset-0 hidden items-center justify-center px-6 text-center text-base text-gray-400 bg-gradient-to-b from-black/90 to-gray-900/95 z-10">
        3D view is best on desktop. Explore the project list below instead.
      </div>

      <div id="mini-player" class="fixed left-4 bottom-4 sm:left-6 sm:bottom-6 z-40 pointer-events-auto">
        <div class="flex items-center gap-4 rounded-2xl border border-white/10 bg-black/70 px-4 py-3 backdrop-blur-2xl shadow-[0_20px_40px_rgba(0,0,0,0.55)] text-gray-100">
          <button id="player-toggle" class="w-10 h-10 rounded-full border border-white/20 bg-white/5 text-sm font-semibold text-white hover:bg-white/15 transition" aria-label="Toggle playback">
            ▶
          </button>
          <div class="flex flex-col text-xs">
            <span class="text-gray-400">butterlabs.player</span>
            <span class="text-sm text-white font-semibold">?!??!?!</span>
          </div>
          <label class="flex items-center gap-2 text-xs text-gray-400">
            <span>vol</span>
            <input id="player-volume" type="range" min="0" max="1" step="0.01" value="0.7" class="h-1 w-24 cursor-pointer accent-lime-300">
          </label>
        </div>
      </div>
    </div>

    <section id="mobile-shell" class="mobile-shell min-h-screen w-full bg-gradient-to-b from-gray-950 via-gray-900 to-black text-gray-100">
      <div class="mx-auto flex w-full max-w-md flex-col gap-8 px-6 py-10">
        <header class="space-y-4">
          <div class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/5 px-4 py-2 text-xs uppercase tracking-[0.3em] text-gray-300">
            butterlabs
            <span class="inline-flex h-2 w-2 rounded-full bg-lime-300 animate-pulse"></span>
          </div>
          <div>
            <p class="text-3xl font-semibold text-white leading-tight">idk</p>
            <p class="mt-3 text-base text-gray-300">idk</p>
          </div>
          <div class="flex items-center justify-between text-sm text-gray-400">
            <span>projects live</span>
            <span id="mobile-project-count" class="text-2xl font-mono text-white">00</span>
          </div>
        </header>



        <div class="rounded-3xl border border-white/10 bg-white/5 p-5 space-y-4">
          <div class="flex flex-col gap-2">
            <span class="text-xs uppercase tracking-wide text-gray-300">now playing</span>
            <p class="text-lg font-semibold text-white">?!?!?!?!?</p>
          </div>
          <div class="flex items-center justify-between gap-4">
            <button id="mobile-player-toggle" class="rounded-full border border-white/30 bg-white/10 px-4 py-2 text-sm font-semibold text-white" aria-label="Toggle playback">
              play
            </button>
            <input id="mobile-player-volume" type="range" min="0" max="1" step="0.01" value="0.7" class="h-1 w-full accent-lime-300">
          </div>
        </div>

      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/AsciiEffect.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.0.0-rc.5/dist/html2canvas.min.js"></script>
    <script src="scripts/404.js"></script>
  </body>

</html>
