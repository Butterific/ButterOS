    <style>
      html, body {
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      body {
        min-height: 100vh;
      }

      body.desktop-locked {
        overflow: hidden;
      }

      body.mobile-experience {
        overflow-y: auto;
        background: radial-gradient(circle at top, rgba(255, 238, 140, 0.15), rgba(0, 0, 0, 0.85));
      }

      .desktop-shell {
        position: relative;
        min-height: 100vh;
      }

      .mobile-shell {
        display: none;
      }

      body.mobile-experience .desktop-shell {
        display: none;
      }

      body.mobile-experience .mobile-shell {
        display: flex;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
